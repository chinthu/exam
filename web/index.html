<!DOCTYPE html>
<html>
<head>
  <!--
    If you are serving your web app in a path other than the root, change the
    href value below to reflect the base path you are serving from.

    The path provided below has to start and end with a slash "/" in order for
    it to work correctly.

    For more details:
    * https://developer.mozilla.org/en-US/docs/Web/HTML/Element/base

    This is a placeholder for base href that will be replaced by the value of
    the `--base-href` argument provided to `flutter build`.
  -->
  <base href="$FLUTTER_BASE_HREF">

  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="description" content="Scholarship quiz with multiple choice questions from every syllabus topic.">

  <!-- iOS meta tags & icons -->
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black">
  <meta name="apple-mobile-web-app-title" content="Scholarship Quiz">
  <link rel="apple-touch-icon" href="icons/Icon-192.png">

  <!-- Favicon -->
  <link rel="icon" type="image/png" href="favicon.png"/>

  <title>Scholarship Quiz</title>
  <link rel="manifest" href="manifest.json">
</head>
<body>
  <script>
    (function () {
      var start = function () {
        var script = document.createElement('script');
        script.src = 'flutter_bootstrap.js?v=20261005c';
        script.async = true;
        document.body.appendChild(script);
      };
      if (!('serviceWorker' in navigator)) {
        start();
        return;
      }
      navigator.serviceWorker.getRegistrations().then(function (registrations) {
        var hadWorker = registrations.length > 0;
        return Promise.all(registrations.map(function (registration) {
          return registration.unregister();
        })).then(function () {
          return hadWorker;
        });
      }).then(function (hadWorker) {
        if (!window.caches) return hadWorker;
        return caches.keys().then(function (keys) {
          return Promise.all(keys.map(function (key) {
            return caches.delete(key);
          }));
        }).then(function () {
          return hadWorker;
        });
      }).then(function (hadWorker) {
        if (hadWorker && !sessionStorage.getItem('quiz-cache-cleared')) {
          sessionStorage.setItem('quiz-cache-cleared', '1');
          location.reload();
          return;
        }
        start();
      }).catch(start);
    })();
  </script>
</body>
</html>
